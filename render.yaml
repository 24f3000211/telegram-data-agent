services:
  - type: web
    name: telegram-data-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: PUBLIC_BASE_LOG_URL
        value: https://telegram-data-agent.onrender.com/logs
      - key: REQUEST_TIMEOUT_SECONDS
        value: "45"
      - key: MAX_DOWNLOAD_BYTES
        value: "25000000"
      - key: TEMP_DIR
        value: temp
      - key: LOGS_DIR
        value: logs
